<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <title>Cluster Watcher: server boxes under a magnifying glass</title>
  <!-- VS Code draws Activity Bar icons as a one-colour silhouette, so the
       servers are cut out (not painted over) behind the glass, with a small
       gap around the lens and handle, as the opaque lens does in icon.png. -->
  <defs>
    <mask id="behind-glass" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect width="24" height="24" fill="white"/>
      <circle cx="17.25" cy="5.75" r="4.85" fill="black" stroke="none"/>
      <path d="m19.7 8.2 2.8 2.8" stroke="black" stroke-width="3.2"/>
    </mask>
  </defs>
  <g mask="url(#behind-glass)">
    <rect x="3" y="3" width="18" height="5" rx="1"/>
    <rect x="3" y="10" width="18" height="5" rx="1"/>
    <rect x="3" y="17" width="18" height="4" rx="1"/>
    <circle cx="6.5" cy="5.5" r=".8" fill="currentColor" stroke="none"/>
    <circle cx="6.5" cy="12.5" r=".8" fill="currentColor" stroke="none"/>
    <circle cx="6.5" cy="19" r=".8" fill="currentColor" stroke="none"/>
    <path d="M10 5.5h3M10 12.5h7M10 19h7"/>
  </g>
  <circle class="magnifier-lens" cx="17.25" cy="5.75" r="3.25" stroke-width="2"/>
  <path class="magnifier-handle" d="m19.7 8.2 2.8 2.8" stroke-width="2"/>
</svg>
