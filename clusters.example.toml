# Example Cluster Watcher configuration. Copy it to clusters.toml (or run
# `cluster-watcher setup`) and replace the example machines with your own.
# This file contains connection identities, not passwords. SSH keys, agent
# forwarding, host verification, ProxyJump, etc. remain managed by your normal
# OpenSSH configuration.
# Add `hidden = true` to any machine entry to skip its login, polling, and display.

[[machine]]
name = "cluster-a"
host = "login.cluster-a.example.org"
username = "alice"
default_partition_max_time_minutes = 1440
# Explicit `path=` log requests are limited to these remote directory trees.
job_log_roots = ["/home/alice/jobs"]
# port = 22
# identity_file = "~/.ssh/id_ed25519"

[[machine]]
name = "cluster-b"
host = "login.cluster-b.example.org"
username = "alice"
# Prompts once for the shared password, then for each machine's single-use OTP.
interactive_auth = true
credential_group = "site-b"
# OpenSSH closes the background session after this period without activity.
control_persist = "8h"
default_partition_max_time_minutes = 1440

[machine.partition_max_time_minutes]
gpudev = 15

[dashboard]
# Pending-job waits are displayed as < 5 minutes, < 30 minutes, then as a nearest-hour estimate.
wait_threshold_minutes = [5, 30]

# Optional per-device GPU/APU profiles live in this same configuration file.
# Aliases match Slurm GRES types, partition names, or node-name prefixes.
# Dense FP16/BF16 Tensor throughput excludes vendor sparsity multipliers.
[[profile]]
cluster = "cluster-a"
name = "NVIDIA H100 80 GB"
aliases = ["h100"]
vram_gb = 80
fp16_bf16_tensor_tflops = 989.0

[[profile]]
cluster = "cluster-b"
name = "AMD Instinct MI300A"
aliases = ["mi300a", "apu"]
vram_gb = 128
fp16_bf16_tensor_tflops = 980.6
