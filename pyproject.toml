[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cluster-watcher"
version = "0.1.0"
description = "Inspect multiple Slurm clusters over SSH from a terminal or local dashboard."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cluster Watcher contributors" }]
license = { text = "GPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)"]
dependencies = []

[project.optional-dependencies]
standalone = ["pyinstaller>=6.0,<7"]

[project.scripts]
cluster-watcher = "clusterwatcher.cli:main"

[tool.setuptools]
packages = ["clusterwatcher"]

