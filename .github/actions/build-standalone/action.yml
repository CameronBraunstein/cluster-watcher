# Build and smoke-test one native PyInstaller executable.
name: Build standalone executable
description: Build one native Cluster Watcher release artifact.
inputs:
  artifact:
    description: Exact release filename expected from cluster-watcher.spec.
    required: true
  linux-arch:
    description: manylinux architecture (x86_64 or aarch64); empty off Linux.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6

    - name: Build on Linux or macOS
      if: runner.os != 'Windows'
      shell: bash
      env:
        # The interpreter's own deployment target remains the effective floor;
        # this prevents project-built objects from accidentally requiring newer macOS.
        MACOSX_DEPLOYMENT_TARGET: "12.0"
      run: |
        uv python install 3.12
        uv venv --python 3.12 --managed-python .build-venv
        uv pip install --python .build-venv 'pyinstaller>=6.0,<7'
        .build-venv/bin/python -m PyInstaller --noconfirm --clean cluster-watcher.spec
        test -x "dist/${{ inputs.artifact }}"
        "dist/${{ inputs.artifact }}" --help
        "dist/${{ inputs.artifact }}" --config clusters.example.toml list

    - name: Prove Linux compatibility with glibc 2.17
      if: runner.os == 'Linux'
      shell: bash
      run: |
        docker run --rm -v "$PWD:/work" -w /work \
          "quay.io/pypa/manylinux2014_${{ inputs.linux-arch }}" \
          "dist/${{ inputs.artifact }}" --config clusters.example.toml list

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        uv python install 3.12
        uv venv --python 3.12 --managed-python .build-venv
        uv pip install --python .build-venv 'pyinstaller>=6.0,<7'
        & .build-venv/Scripts/python.exe -m PyInstaller --noconfirm --clean cluster-watcher.spec
        $binary = "dist/${{ inputs.artifact }}"
        if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "missing $binary" }
        & $binary --help | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "standalone help smoke test failed" }
        & $binary --config clusters.example.toml list
        if ($LASTEXITCODE -ne 0) { throw "standalone configuration smoke test failed" }
