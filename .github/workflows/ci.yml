# Run every test suite on pushes to master and on pull requests.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", os: Linux, runner: ubuntu-latest }
          - { python: "3.12", os: Linux, runner: ubuntu-latest }
          - { python: "3.13", os: Linux, runner: ubuntu-latest }
          - { python: "3.12", os: macOS, runner: macos-15 }
          - { python: "3.12", os: Windows, runner: windows-2022 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run complete Python suite
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -t tests -v
      - name: Run native Windows policy tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -t tests -p test_platforms.py -v
      - name: Validate PowerShell installer help
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Help
          ./uninstall.ps1 -Help

  extension:
    name: VS Code extension tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Integration test in a real VS Code
        run: xvfb-run -a npm run test:integration

  standalone:
    name: Standalone (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, artifact: cluster-watcher-linux-x86_64, linux_arch: x86_64 }
          - { runner: ubuntu-24.04-arm, artifact: cluster-watcher-linux-aarch64, linux_arch: aarch64 }
          - { runner: macos-15-intel, artifact: cluster-watcher-macos-x86_64, linux_arch: "" }
          - { runner: macos-15, artifact: cluster-watcher-macos-aarch64, linux_arch: "" }
          - { runner: windows-2022, artifact: cluster-watcher-windows-x86_64.exe, linux_arch: "" }
          - { runner: windows-11-arm, artifact: cluster-watcher-windows-aarch64.exe, linux_arch: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-standalone
        with:
          artifact: ${{ matrix.artifact }}
          linux-arch: ${{ matrix.linux_arch }}
